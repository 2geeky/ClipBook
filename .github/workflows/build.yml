name: Build ClipBook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ClipBook.xcodeproj -scheme ClipBook

      - name: Build app
        run: |
          xcodebuild \
            -project ClipBook.xcodeproj \
            -scheme ClipBook \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/DerivedData/Build/Products/Release/ClipBook.app" \
            "$RUNNER_TEMP/ClipBook-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ClipBook-macOS
          path: ${{ runner.temp }}/ClipBook-macOS.zip
          if-no-files-found: error
